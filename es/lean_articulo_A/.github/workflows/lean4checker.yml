# Comprobación independiente con lean4checker: vuelve a pasar por el núcleo de Lean todas las
# declaraciones de las que depende el teorema final, incluidas las de Mathlib (--fresh).
# Es lenta (puede tardar horas); se lanza a mano desde la pestaña Actions.
name: lean4checker

on:
  workflow_dispatch:

jobs:
  lean4checker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Compilar lean4checker (v4.19.0)
        run: |
          git clone --depth 1 --branch v4.19.0 https://github.com/leanprover/lean4checker "$RUNNER_TEMP/lean4checker"
          cd "$RUNNER_TEMP/lean4checker" && lake build

      - name: Comprobar el teorema final desde cero
        run: |
          lake env "$RUNNER_TEMP/lean4checker/.lake/build/bin/lean4checker" --fresh CierreDeLosSeisBloquesDelArticuloA 2>&1 | tee lean4checker.txt

      - name: Guardar el registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-lean4checker
          path: lean4checker.txt
